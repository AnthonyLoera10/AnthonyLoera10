name: Refresh ASCII Profile Card

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Latest Dark Card
        run: curl -fL "https://gh.crafter.run/AnthonyLoera10?theme=dark&cols=140" -o dark_mode.svg

      - name: Fetch Latest Light Card
        run: curl -fL "https://gh.crafter.run/AnthonyLoera10?theme=light&cols=140" -o light_mode.svg

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git diff --staged --quiet || (git commit -m "chore: auto-update ASCII profile cards" && git push)
