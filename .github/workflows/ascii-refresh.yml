
name: Refresh ASCII Profile Card

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Fetch Latest Dark Card
        run: curl -fL "https://gh.crafter.run/AnthonyLoera10?theme=dark&cols=140" -o dark_mode.svg

      - name: Fetch Latest Light Card
        run: curl -fL "https://gh.crafter.run/AnthonyLoera10?theme=light&cols=140" -o light_mode.svg

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update ASCII profile cards"
            git push
          else
            echo "No changes to the ASCII cards."
          fi
